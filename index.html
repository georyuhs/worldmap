<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나라야, 가라앉지마 · 세계지도 서바이벌</title>
<style>
:root{
  /* ── 종이·잉크 ─────────────────────────────── */
  --ink:#FAF9F6;          /* 화면 바탕 (변수명은 기존 코드 호환용) */
  --panel:#FFFFFF;
  --paper:#16212C;        /* 본문 글자 */
  --paper-2:#41505F;
  --dim:#8B95A2;
  --line:rgba(22,33,44,.09);
  --line-2:rgba(22,33,44,.15);

  /* ── 바다 : 종이보다 한 단계 짙게 깔아 지도를 한 덩어리로 보이게 한다 ── */
  --sea:#CBDAE1;          /* 채도를 뺀 강청색 */
  --sea-2:#B8CCD6;        /* 경위선 */
  --sea-deep:#14303E;     /* 이름표·안내문 바탕 */

  /* ── 육지 : 밝은 종이빛 위에 출제 범위만 흙빛으로 얹는다 ── */
  --land:#D8A97C;         /* 출제 범위(클릭 가능) · 차분한 흙빛 */
  --land-hi:#EABF97;
  --land-2:#F2EFE8;       /* 출제 범위 밖 · 종이빛 */
  --border-on:#33444F;
  --border-off:#C9C2B6;
  --border:var(--border-on);

  /* ── 강조색 ─────────────────────────────────── */
  --accent:#14564F;       /* 주 액션 · 깊은 청록 */
  --accent-hi:#1A6C63;
  --accent-soft:#E5EFEC;
  --gold:#A9761F;         /* 숫자 강조 */
  --ok:#157A5E;           /* 정답 */
  --no:#B44A3F;           /* 오답 */
  --reveal:#33424E;       /* 놓친 나라 공개 · 짙은 먹빛 */
  /* 이전 이름 호환 */
  --mint:var(--ok); --coral:var(--no); --amber:var(--accent);

  --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(22,33,44,.04),0 4px 14px rgba(22,33,44,.05);
  --shadow-lg:0 2px 4px rgba(22,33,44,.04),0 16px 36px rgba(22,33,44,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--paper);font-family:var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
button:focus-visible,.card:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ───────── 홈 ───────── */
#home{overflow-y:auto;overflow-x:hidden;background:
  radial-gradient(70% 42% at 50% -8%,rgba(213,226,233,.55),transparent 70%),
  var(--ink)}
.wrap{width:min(900px,100%);margin:0 auto;padding:clamp(26px,6vw,56px) clamp(18px,5vw,32px) 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(28px,6vw,48px)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.1em;
  color:var(--dim);font-weight:700}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--line-2)}
h1{font-size:clamp(30px,7.4vw,50px);font-weight:800;letter-spacing:-.035em;line-height:1.12}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--paper-2);margin-top:16px;font-size:15px;line-height:1.72;max-width:46ch}
.rule{height:1px;background:var(--line);margin:clamp(30px,6vw,44px) 0 22px}
.lbl{font-size:10.5px;letter-spacing:.1em;color:var(--dim);font-weight:700;margin:20px 0 11px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:660px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{
  position:relative;text-align:left;background:var(--panel);border:1px solid var(--line-2);
  border-radius:16px;padding:16px;transition:transform .2s cubic-bezier(.2,.8,.3,1),border-color .2s,box-shadow .2s;
  display:flex;flex-direction:column;gap:10px;min-height:248px;box-shadow:var(--shadow);
}
.card:hover{transform:translateY(-4px);border-color:rgba(20,86,79,.35);box-shadow:var(--shadow-lg)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-lg)}
.card .no{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.16em;font-weight:600}
.card h3{font-size:20px;font-weight:800;letter-spacing:-.025em}
.card .thumb{flex:none;height:130px;display:flex;align-items:center;justify-content:center;
  background:var(--sea);border-radius:10px;overflow:hidden}
.card .thumb svg{width:100%;height:130px;display:block}
.card .meta{font-size:12px;color:var(--dim);line-height:1.6}
.card .n{color:var(--paper);font-family:var(--mono);font-weight:700}

/* 설정 패널 */
#setup{display:none;margin-top:16px;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:clamp(18px,4vw,26px);box-shadow:var(--shadow)}
#setup.on{display:block;animation:rise .28s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.set-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.set-head h2{font-size:23px;font-weight:800;letter-spacing:-.03em}
.set-head span{color:var(--dim);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chipbtn{
  border:1px solid var(--line-2);background:var(--panel);color:var(--paper-2);border-radius:10px;
  padding:10px 15px;font-size:13.5px;font-weight:600;transition:.16s;min-height:42px;letter-spacing:-.01em;
}
.chipbtn:hover{border-color:var(--accent);color:var(--paper)}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chipbtn small{font-family:var(--mono);opacity:.6;margin-left:6px;font-size:11px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px;align-items:center}
.btn{border-radius:11px;padding:13px 20px;font-weight:700;font-size:15px;border:1px solid var(--line-2);
  background:var(--panel);transition:.16s;min-height:48px;letter-spacing:-.015em}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.count{margin-left:auto;font-size:12.5px;color:var(--dim);font-weight:600}
.count b{color:var(--paper);font-family:var(--mono);font-size:17px}

/* 로딩 / 오류 */
#boot{padding:12px 15px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);font-size:13px;color:var(--dim);display:flex;gap:10px;align-items:center;margin-bottom:20px}
#boot .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
#boot.err{border-color:rgba(188,68,59,.35)}
#boot.err .dot{background:var(--no);animation:none}
#boot.ok{display:none}
#boot input{display:none}

/* ───────── 게임 ───────── */
#play{background:var(--ink)}
.hud{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line-2);
  background:var(--panel);flex-wrap:wrap}
.hud .name{font-weight:800;font-size:13.5px;letter-spacing:-.025em;line-height:1.25}
.hud .name small{display:block;font-weight:500;color:var(--dim);font-size:10.5px;letter-spacing:0;margin-top:1px}
.stats{display:flex;align-items:center;gap:2px;background:rgba(22,33,44,.035);border-radius:9px;padding:4px 6px}
.stat{font-size:10px;color:var(--dim);display:flex;align-items:baseline;gap:4px;font-weight:600;
  padding:2px 8px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{font-family:var(--mono);font-size:15px;color:var(--paper);font-weight:700}
.stat.combo b{color:var(--gold)}
.lives{letter-spacing:1px;font-size:11px;color:var(--no)}
.hud .sp{flex:1}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.iconbtn{border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;
  color:var(--paper-2);min-height:38px;background:var(--panel);transition:.16s;letter-spacing:-.01em}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn.off{color:var(--dim)}
.iconbtn.on{color:#fff;background:var(--accent);border-color:var(--accent)}

#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:var(--sea)}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapctl{position:absolute;left:14px;top:14px;z-index:5;display:none;flex-direction:column;
  background:#FFFFFF;border-radius:11px;overflow:hidden;
  border:1px solid var(--line-2);box-shadow:var(--shadow)}
.mapctl button{width:38px;height:38px;background:transparent;border:none;border-bottom:1px solid var(--line);
  font-size:17px;font-weight:600;color:var(--paper-2);line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.12s}
.mapctl button:last-child{border-bottom:none}
.mapctl button:hover{background:var(--accent-soft);color:var(--accent)}
.mapctl button:active{background:var(--accent);color:#fff}

/* 지도 · 나라 색 (클릭 가능 / 불가) */
.cpath{stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .14s}
.cpath.other{fill:var(--land-2);stroke:var(--border-off);stroke-width:.7}
.cpath.target{fill:var(--land);stroke:var(--border-on);stroke-width:1.1}
#stage.live .cpath.target{cursor:pointer}
#stage.live .cpath.target:hover{fill:var(--land-hi)}
.cpath.hit-ok{fill:var(--ok)!important;stroke:#0D5744!important}
.cpath.hit-no{fill:var(--no)!important;stroke:#87332B!important}
.cpath.reveal{fill:var(--reveal)!important;stroke:#1D2A33!important}
.dot{stroke:var(--border-on);stroke-width:1.3;fill:var(--land)}
.dot.other{fill:var(--land-2);stroke:var(--border-off)}
.dothit{fill:transparent;stroke:none;cursor:pointer}
#stage.live .dot:hover{fill:var(--land-hi)}
.dot.hit-ok{fill:var(--ok)!important}.dot.hit-no{fill:var(--no)!important}.dot.reveal{fill:var(--reveal)!important}
.grat{stroke:var(--sea-2);stroke-width:.7;fill:none;opacity:.9}
.eqline{stroke:#8A5C2E;stroke-width:1;stroke-dasharray:6 6;fill:none;opacity:.45}
.eqlabel{font-size:8.5px;font-weight:700;fill:#7E5228;letter-spacing:.1em;pointer-events:none;opacity:.75}
.leader{stroke:rgba(22,33,44,.35);stroke-width:.7;fill:none}
/* 배경 상자를 깔면 지도가 가려져서, 글자에 흰 테두리(버퍼)만 둘러 읽히게 한다.
   paint-order:stroke 덕분에 테두리가 먼저 깔리고 글자가 그 위에 얹힌다. */
.plabel{font-size:10.5px;font-weight:700;fill:#1C2833;letter-spacing:-.02em;pointer-events:none;
  paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4px;stroke-linejoin:round;stroke-opacity:.92}

/* 낙하 이름표 */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.chip{
  position:absolute;transform:translate(-50%,0);will-change:transform;
  background:var(--sea-deep);border-radius:9px;padding:8px 15px 9px;text-align:center;
  box-shadow:0 10px 26px rgba(20,48,62,.22),0 1px 0 rgba(255,255,255,.08) inset;
}
.chip b{display:block;font-size:clamp(14px,2.5vw,18px);font-weight:700;letter-spacing:-.03em;white-space:nowrap;color:#F7F5F0}
.chip i{display:block;font-style:normal;font-size:9.5px;color:rgba(239,203,136,.85);margin-top:3px;letter-spacing:.1em;font-weight:600}
.chip::before{content:"";position:absolute;left:50%;bottom:100%;width:1px;height:min(46vh,340px);
  background:linear-gradient(to top,rgba(20,48,62,.28),transparent);pointer-events:none}
.chip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-3px;border:3px solid transparent;border-top-color:var(--sea-deep)}
.chip.gone{transition:opacity .3s ease;opacity:0}
.sealine{position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(20,48,62,.28),transparent)}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:700;font-size:16px;
  pointer-events:none;animation:up 1s ease-out forwards;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 7px #fff}
@keyframes up{0%{opacity:1}100%{opacity:0;transform:translate(-50%,-170%)}}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(6px);background:var(--sea-deep);color:#F7F5F0;
  border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;letter-spacing:-.01em;
  box-shadow:0 8px 24px rgba(20,48,62,.22);
  opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#pause{position:absolute;inset:0;z-index:10;background:rgba(250,249,246,.92);backdrop-filter:blur(7px);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:20px}
#pause.on{display:flex}
#pause h2{font-size:24px;font-weight:800;letter-spacing:-.03em}

/* ───────── 살펴보기 모드 ───────── */
#play.peekmode .stats,#play.peekmode #btnSpeed,#play.peekmode #btnPause{display:none}
#play.peekmode .hud .name::after{content:"살펴보기";margin-left:8px;font-size:9.5px;font-weight:700;
  letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:5px;
  vertical-align:middle}
.peekbar{display:none;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 14px;
  border-top:1px solid var(--line-2);background:var(--panel)}
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend em{font-style:normal}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;flex:none}
.legend i.on{background:var(--land);border:1px solid var(--border-on)}
.legend i.off{background:var(--land-2);border:1px solid var(--border-off)}
.legend b{color:var(--paper);font-family:var(--mono)}
.legend .hint{color:var(--accent);font-weight:600}
.legend .hint:empty{display:none}
.pkact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pkact .btn{padding:11px 18px;min-height:44px;font-size:14px}
@media(max-width:600px){
  .legend{width:100%;font-size:11.5px;gap:14px}
  .pkact{margin-left:0;width:100%}
  .pkact .btn{flex:1}
}

/* ───────── 결과 ───────── */
#result{overflow-y:auto;background:var(--ink)}
.res{width:min(780px,100%);margin:0 auto;padding:clamp(30px,6vw,60px) 20px 70px}
.res h2{font-size:clamp(25px,5vw,36px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
.ressub{color:var(--dim);font-size:13.5px;margin-top:8px;letter-spacing:-.01em}
.res .verdict{display:inline-flex;align-items:center;gap:8px;color:var(--dim);font-size:10.5px;font-weight:700;
  letter-spacing:.12em;margin-bottom:12px}
.res .verdict::before{content:"";width:20px;height:1px;background:var(--line-2)}
.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:30px 0 6px}
.sb{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:15px 16px}
.sb span{font-size:10.5px;color:var(--dim);letter-spacing:.06em;font-weight:600}
.sb b{display:block;font-family:var(--mono);font-size:27px;margin-top:7px;font-weight:700;letter-spacing:-.02em}
.list{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line-2);border-radius:8px;padding:7px 11px;font-size:12.5px;background:var(--panel);font-weight:600}
.tag.bad{border-color:rgba(188,68,59,.28);color:#9A342C;background:#FBF0EF}
.tag.good{border-color:rgba(23,122,96,.25);color:var(--ok);background:#EFF6F3}
.tag small{font-family:var(--mono);color:var(--dim);margin-left:6px;font-weight:500;font-size:10.5px}
.pauseset{display:none;gap:8px}
@media(max-width:640px){
  /* 이름은 첫 줄을 온전히 쓰고, 아래 한 줄에 통계와 버튼을 모은다.
     예전엔 버튼이 줄바꿈되며 머리말이 화면의 5분의 1을 차지했다. */
  .hud{gap:8px;padding:8px 10px}
  .hud .name{flex-basis:100%;font-size:12.5px}
  .hud .sp{display:none}
  .tools{margin-left:auto;gap:5px}
  #btnSound,#btnBGM{display:none}       /* 일시정지 화면에서 조절 */
  .pauseset{display:flex}
  #play.peekmode .hud .name{flex-basis:auto}   /* 살펴보기에선 통계가 없으니 한 줄로 */
  .stats{padding:3px 4px}
  .stat{padding:2px 6px}
  .stat b{font-size:13.5px}
  .iconbtn{padding:7px 10px;font-size:11.5px;min-height:34px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<!-- ══════════ 홈 ══════════ -->
<div class="screen on" id="home">
 <div class="wrap">
  <div class="topbar">
    <div class="eyebrow">2026 세계지리 · 권역별 백지도</div>
    <button class="iconbtn off" id="btnBGMHome">배경음</button>
  </div>
  <h1>나라야, 가라앉지마<br><em>세계지도 서바이벌</em></h1>
  <p class="sub">나라 이름이 수면에 닿기 전에, 지도에서 그 나라를 찾아 누르세요.
  권역과 소단원을 골라 원하는 범위만 연습할 수 있습니다.</p>

  <div id="boot"><span class="dot"></span><span id="bootmsg">세계 국경 데이터를 불러오는 중…</span>
    <input type="file" id="fileIn" accept=".json"></div>

  <div class="rule"></div>
  <div class="lbl">권역 선택</div>
  <div class="grid" id="cards"></div>

  <div id="setup"></div>
 </div>
</div>

<!-- ══════════ 게임 ══════════ -->
<div class="screen" id="play">
  <div class="hud">
    <div class="name" id="hudName">—<small id="hudSub">—</small></div>
    <div class="stats">
      <div class="stat">점수<b id="hudScore">0</b></div>
      <div class="stat combo">연속<b id="hudCombo">0</b></div>
      <div class="stat">남은<b id="hudLeft">0</b></div>
      <div class="stat lives" id="hudLives">∞</div>
    </div>
    <div class="sp"></div>
    <div class="tools">
      <button class="iconbtn" id="btnSpeed">보통</button>
      <button class="iconbtn" id="btnSound">소리</button>
      <button class="iconbtn off" id="btnBGM">배경음</button>
      <button class="iconbtn" id="btnPause">일시정지</button>
      <button class="iconbtn" id="btnQuit">나가기</button>
    </div>
  </div>
  <div id="stage">
    <div class="mapctl" id="mapCtl">
      <button id="zIn" aria-label="확대" title="확대">+</button>
      <button id="zOut" aria-label="축소" title="축소">−</button>
      <button id="zFit" aria-label="전체보기" title="전체보기" style="font-size:15px">⤢</button>
    </div>
    <div id="labels"></div>
    <div id="toast"></div>
    <div id="pause"><h2>일시정지</h2>
      <div class="pauseset">
        <button class="iconbtn" id="btnSound2">소리</button>

// 50m 해상도(Natural Earth 셰이프파일 기반)를 우선 사용 — 110m보다 국경선이 훨씬 정교함.

function decodeTopo(topo){
  const t = topo.transform, sx=t?t.scale[0]:1, sy=t?t.scale[1]:1, tx=t?t.translate[0]:0, ty=t?t.translate[1]:0;
  const arcs = topo.arcs.map(a=>{
    let x=0,y=0; const o=[];
    for(const p of a){ if(t){x+=p[0];y+=p[1];o.push([x*sx+tx,y*sy+ty]);} else o.push([p[0],p[1]]); }
    return o;
  });
  const seg = i => i<0 ? arcs[~i].slice().reverse() : arcs[i];
  const ring = list => { const r=[]; for(const i of list){ const a=seg(i); r.push(...(r.length?a.slice(1):a)); } return r; };
  const obj = topo.objects.countries || Object.values(topo.objects)[0];
  const out=[];
  for(const g of obj.geometries){
    const polys = g.type==="Polygon" ? [g.arcs] : g.type==="MultiPolygon" ? g.arcs : null;
    if(!polys) continue;
    const rings=[];
    for(const poly of polys) for(const rr of poly){
      const pts = ring(rr); if(pts.length<4) continue;
      // 경도 180°/-180°를 넘나드는 나라(러시아·피지 등)의 경계상자가 지구 한 바퀴만큼
      // 부풀려지지 않도록, 경도를 이어지는 값으로 펼친(unwrap) 뒤 범위를 잰다.
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, prevLon=null;
      for(const p of pts){
        let lon=p[0];
        if(prevLon!==null){ while(lon-prevLon>180) lon-=360; while(lon-prevLon<-180) lon+=360; }
        prevLon=lon;
        if(lon<x0)x0=lon; if(lon>x1)x1=lon; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1];
      }
      rings.push({pts, bb:[x0,y0,x1,y1]});
    }
    if(!rings.length) continue;
    const name = (g.properties&&(g.properties.name||g.properties.NAME))||"";
    out.push({name, rings, key:ALIAS[norm(name)]||null, ko:NEIGHBOR[name.toLowerCase()]||name});
  }
  return out;
}
function ingest(topo){
  SHAPES = decodeTopo(topo);

const clampLat = v => Math.max(-84,Math.min(84,v));
const myc = lat => Math.log(Math.tan(Math.PI/4 + clampLat(lat)*Math.PI/360))*180/Math.PI; // 경도(도)와 같은 축척
function unionBox(subs){
  let a=[999,-999,999,-999];
  subs.forEach(s=>{const b=SUB[s].box; a[0]=Math.min(a[0],b[0]); a[1]=Math.max(a[1],b[1]); a[2]=Math.min(a[2],b[2]); a[3]=Math.max(a[3],b[3]);});
  return a;
}
function projector(box,W,H,pad){
  const [l0,l1,b0,b1]=box, ymax=myc(b1), ymin=myc(b0);
  const rw=l1-l0, rh=ymax-ymin;
  const s=Math.min((W-2*pad)/rw,(H-2*pad)/rh);
  const ox=(W-s*rw)/2, oy=(H-s*rh)/2;
  const f=(lon,lat)=>[ox+(lon-l0)*s, oy+(ymax-myc(lat))*s];
  f.box=box; f.s=s; return f;
}

function drawMap(W,H,box,opts){
  const padPx = opts.pad!==undefined ? opts.pad : Math.max(14,Math.min(W,H)*0.10);
  const P=projector(box,W,H,padPx);
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"xMidYMid meet"});
  svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"var(--sea)"}));
  // 경위선
  const g=el("g",{class:"grat"});
  for(let lon=Math.ceil(box[0]/15)*15; lon<=box[1]; lon+=15){
    const a=P(lon,box[2]),b=P(lon,box[3]); g.appendChild(el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));
  }
  let eqY=null;
  for(let lat=Math.ceil(box[2]/15)*15; lat<=box[3]; lat+=15){
    const a=P(box[0],lat),b=P(box[1],lat);
    const isEq=lat===0;
    if(isEq) eqY=a[1];
    g.appendChild(el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:isEq?"eqline":""}));
  }
  svg.appendChild(g);
  if(eqY!==null && !opts.thumb && H>60){
    const t=el("text",{x:12,y:eqY-5,class:"eqlabel"}); t.textContent="적도 0°"; svg.appendChild(t);
  }
  // 육지
  // 출제 범위 밖 나라를 먼저, 출제 범위(=클릭 가능) 나라를 그 위에 겹쳐 그린다.
  // 그래야 클릭 가능한 나라의 진한 국경선이 이웃 나라에 덮여 흐려지지 않는다.
  const landOff=el("g",{}), landOn=el("g",{}), marks=el("g",{});
  // 러시아·피지처럼 경도 180°/-180° 선을 넘나드는 나라는, 원본 좌표가 그 경계에서
  // +180↔-180으로 뚝 끊겨 있다. 예전에는 이 지점에서 그냥 선을 끊어버려 국경이
  // 잘린 것처럼 보였는데, 대신 경도를 이어지는 값으로 펼쳐서(unwrap) 그대로
  // 투영하면 국경선이 잘리지 않고 지도 바깥으로 자연스럽게 이어진다.
  const buildRing=(pts,merge)=>{
    let seg="", px=1e9, py=1e9, n=0, prevLon=null;
    for(const raw of pts){
      let lon=raw[0];
      if(prevLon!==null){
        while(lon-prevLon>180) lon-=360;
        while(lon-prevLon<-180) lon+=360;
      }
      prevLon=lon;
      const q=P(lon,raw[1]);
      if(merge && n && Math.abs(q[0]-px)<0.55 && Math.abs(q[1]-py)<0.55) continue;
      seg += (n===0?"M":"L")+q[0].toFixed(1)+" "+q[1].toFixed(1);
      px=q[0]; py=q[1]; n++;
    }
    return {seg,n};
  };
  const drawnArea={}, drawnBox={};
  for(const sh of SHAPES){
    let d="", area=0, bx=[1e9,1e9,-1e9,-1e9];
    for(const r of sh.rings){
      // 예전엔 현재 지역 상자 근처가 아닌 나라의 폴리곤을 아예 건너뛰었는데(성능 최적화),
      // 상자가 넓을 때(예: 아시아+오세아니아) 그 여백 계산이 부정확해서 모로코·서사하라처럼
      // 화면에 실제로 보여야 할 이웃 나라까지 통째로 빠지는 문제가 있었다. 나라 수가
      // 많지 않아 다 그려도 가벼우니, 화면 밖으로 나가는 부분은 SVG가 알아서 잘라내도록
      // 맡기고 여기서는 더 이상 미리 걸러내지 않는다.
      const b=r.bb;
      let {seg,n}=buildRing(r.pts,true);
      if(n<3) ({seg,n}=buildRing(r.pts,false)); // 초소형 축척: 병합 없이 원래 좌표로 재시도
      if(n>=3){
        d+=seg+"Z";
        const w=(b[2]-b[0])*P.s, h=(myc(b[3])-myc(b[1]))*P.s; area+=w*h;
        const p0=P(b[0],b[3]), p1=P(b[2],b[1]);   // 좌상 · 우하
        bx[0]=Math.min(bx[0],p0[0]); bx[1]=Math.min(bx[1],p0[1]);
        bx[2]=Math.max(bx[2],p1[0]); bx[3]=Math.max(bx[3],p1[1]);
      }
    }
    if(!d) continue;
    drawnArea[sh.key||sh.name]=area;
    if(sh.key) drawnBox[sh.key]=bx;
    const isT = sh.key && opts.targets.has(sh.key);
    const p=el("path",{d,class:"cpath "+(isT?"target":"other"),"fill-rule":"evenodd"});
    p.dataset.k = sh.key||""; p.dataset.n = sh.ko||sh.name;
    (isT?landOn:landOff).appendChild(p);
  }
  // 실제 폴리곤이 있는 나라는 반드시 그 모양 그대로 보여준다.
  // 점(원)은 폴리곤 데이터가 전혀 없는 나라에만 사용하고, 작은 폴리곤에는
  // '보이지 않는' 터치 영역만 겹쳐서 형태를 가리지 않으면서 탭하기 쉽게 한다.
  const dots={}, noShape=[], centers={};
  opts.targets.forEach(k=>{
    const c=BY_KEY[k], q=P(c.lon,c.lat);
    centers[k]=q;
    if(q[0]<-20||q[0]>W+20||q[1]<-20||q[1]>H+20) return;
    if(drawnArea[k]===undefined) noShape.push({k,c,x:q[0],y:q[1],ox:q[0],oy:q[1]});
  });
  // 폴리곤이 있는 작은 나라: 이웃과의 거리에 맞춰 터치 반경을 조절한 투명 원(형태는 그대로 유지)
  const tKeys=[...opts.targets];
  tKeys.forEach(k=>{
    if(drawnArea[k]===undefined) return;           // 폴리곤 없음 → 아래 dot 처리
    if(drawnArea[k]>900) return;                    // 이미 충분히 커서 직접 탭 가능
    const q=centers[k]; if(q[0]<-20||q[0]>W+20||q[1]<-20||q[1]>H+20) return;
    let nearest=1e9;
    tKeys.forEach(o=>{ if(o===k) return; const q2=centers[o]; if(!q2) return;
      nearest=Math.min(nearest,Math.hypot(q2[0]-q[0],q2[1]-q[1])); });
    const r=Math.max(7,Math.min(14,nearest/2-2));
    const hit=el("circle",{cx:q[0],cy:q[1],r,class:"dothit"});
    hit.dataset.k=k; hit.dataset.n=BY_KEY[k].ko; marks.appendChild(hit);
  });
  // 폴리곤 데이터가 전혀 없는 나라 → 부득이하게 점으로 표시(겹치지 않도록 배치)
  const pending=noShape;
  const MINSEP=Math.max(20,Math.min(30,900/Math.max(1,pending.length)));
  for(let iter=0;iter<50;iter++){
    let moved=false;
    for(let i=0;i<pending.length;i++) for(let j=i+1;j<pending.length;j++){
      const A=pending[i],B=pending[j], dx=B.x-A.x, dy=B.y-A.y, dist=Math.hypot(dx,dy)||.0001;
      if(dist<MINSEP){
        const push=(MINSEP-dist)/2, ux=dx/dist, uy=dy/dist;
        A.x-=ux*push; A.y-=uy*push; B.x+=ux*push; B.y+=uy*push; moved=true;
      }
    }
    if(!moved) break;
  }
  pending.forEach(p=>{
    const moved=Math.hypot(p.x-p.ox,p.y-p.oy)>3;
    if(moved) marks.appendChild(el("line",{x1:p.ox,y1:p.oy,x2:p.x,y2:p.y,stroke:"var(--border)","stroke-width":1,opacity:.45}));
    // 보이지 않는 넓은 터치 영역(모바일 탭 최소 크기 확보)
    const hit=el("circle",{cx:p.x,cy:p.y,r:15,class:"dothit"});
    hit.dataset.k=p.k; hit.dataset.n=p.c.ko; marks.appendChild(hit);
    // 실제로 보이는 작은 점 (폴리곤이 전혀 없을 때만)
    const cir=el("circle",{cx:p.x,cy:p.y,r:7,class:"dot"});
    cir.dataset.k=p.k; cir.dataset.n=p.c.ko; dots[p.k]=cir; marks.appendChild(cir);
  });
  svg.appendChild(landOff); svg.appendChild(landOn); svg.appendChild(marks);
  // 나라 이름은 여기서 곧바로 그리지 않고, 필요한 정보만 실어 둔다.
  // 실제 배치는 renderLabels()가 "지금 화면에 보이는 상태"를 기준으로 계산한다
  // (예전에는 한 번 계산한 자리를 확대해도 그대로 써서, 유럽처럼 빽빽한 곳에서는
  //  라벨이 아프리카까지 밀려나 어느 나라 이름인지 알 수 없었다).
  if(opts.names){
    const data=[];
    opts.targets.forEach(k=>{
      const c=BY_KEY[k];
      const q = dots[k] ? [+dots[k].getAttribute("cx"),+dots[k].getAttribute("cy")+14] : P(c.lon,c.lat);
      data.push({k,name:c.ko,ax:q[0],ay:q[1],box:drawnBox[k]||null,area:drawnArea[k]||0});
    });
    data.sort((a,b)=>b.area-a.area);   // 넓은 나라부터 자리를 잡는다
    svg.__labels=data;
    svg.__labelG=el("g",{class:"plabels"});
    svg.appendChild(svg.__labelG);
  }
  svg.__P=P;
  return svg;
}

const stage=document.getElementById("stage"), labelsEl=document.getElementById("labels"), toastEl=document.getElementById("toast");
const mapCtl=document.getElementById("mapCtl"), peekBar=document.getElementById("peekBar");
const playEl=document.getElementById("play");
const SPEED={slow:{dur:13,max:1,gap:.8},normal:{dur:9.5,max:2,gap:4.0},fast:{dur:7,max:3,gap:2.3}};
let G=null, raf=0, soundOn=true, actx=null;

/* ═══════════ 5-1. 지도 확대/축소·이동 (지도 먼저 살펴보기 전용) ═══════════ */
const ZMIN=1, ZMAX=8;
function initView(){ return {scale:1, fx:.5, fy:.5}; }
function clampView(v){
  v.scale=Math.max(ZMIN,Math.min(ZMAX,v.scale));
  const halfX=0.5/v.scale, halfY=0.5/v.scale;
  v.fx=Math.max(halfX,Math.min(1-halfX,v.fx));
  v.fy=Math.max(halfY,Math.min(1-halfY,v.fy));
  return v;
}
function applyView(svg,W,H){
  if(!svg||!G||!G.view) return;
  const v=G.view, vw=W/v.scale, vh=H/v.scale;
  const vx=v.fx*W-vw/2, vy=v.fy*H-vh/2;
  svg.setAttribute("viewBox",`${vx.toFixed(2)} ${vy.toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}`);
  renderLabels(svg);
}

/* ── 나라 이름 배치 ───────────────────────────────────────────────
   원칙: 이름은 언제나 그 나라 위에 얹는다. 글자 크기는 화면 기준으로 거의 고정이라
   확대할수록 나라가 커지고, 그만큼 자리가 생겨 더 많은 이름이 나타난다.
   자리가 없으면 억지로 먼 곳에 밀어내지 않고 그냥 숨긴다 — 엉뚱한 나라 위에
   떠 있는 이름이 아예 없는 것보다 훨씬 헷갈리기 때문. */
const KO_CH=/[ᄀ-ᇿ　-ヿ一-鿿가-힯＀-￯]/;
function textWidth(str,fs){ let u=0; for(const ch of str) u += KO_CH.test(ch)?1:0.54; return u*fs; }
function renderLabels(svg){
  const g=svg&&svg.__labelG, data=svg&&svg.__labels;
  if(!g||!data) return;
  while(g.firstChild) g.removeChild(g.firstChild);
  const vb=svg.viewBox.baseVal;
  if(!vb||!vb.width||!vb.height) return;
  const W=(G&&G.W)||vb.width, H=(G&&G.H)||vb.height;
  const k=W/vb.width;                       // 지도 좌표 → 화면 픽셀
  const toU=(sx,sy)=>[vb.x+sx/k, vb.y+sy/k];
  const scale=Math.max(1,(G&&G.view&&G.view.scale)||1);
  const FS=Math.min(16, 11.5*(1+0.15*Math.log2(scale)));   // 확대할수록 아주 조금만 커진다
  const placed=[], EPS=2;
  const clash=r=>placed.some(q=>!(r.x2<q.x1-EPS||r.x1>q.x2+EPS||r.y2<q.y1-EPS||r.y1>q.y2+EPS));
  let hidden=0;
  for(const it of data){
    let sx=(it.ax-vb.x)*k, sy=(it.ay-vb.y)*k;
    // 나라의 일부만 화면에 보일 때(예: 유럽 지도의 러시아)는 보이는 쪽으로 끌어온다
    if(it.box){
      const x1=Math.max(6,(it.box[0]-vb.x)*k), x2=Math.min(W-6,(it.box[2]-vb.x)*k);
      const y1=Math.max(6,(it.box[1]-vb.y)*k), y2=Math.min(H-6,(it.box[3]-vb.y)*k);
      if(x1>x2||y1>y2){ continue; }          // 화면 밖 — 그릴 필요 없음
      sx=Math.max(x1,Math.min(x2,sx)); sy=Math.max(y1,Math.min(y2,sy));
    }else if(sx<0||sx>W||sy<0||sy>H) continue;
    const w=textWidth(it.name,FS)+5, h=FS+3;
    // 우선 나라 한가운데, 안 되면 바로 위·아래로 아주 조금만 비켜 본다
    const cands=[[0,0],[0,-(h+2)],[0,h+2],[0,-(2*h+4)],[0,2*h+4],[-(w/2+7),0],[w/2+7,0]];
    let put=null;
    for(const [dx,dy] of cands){
      const x=sx+dx, y=sy+dy;
      if(x-w/2<2||x+w/2>W-2||y-h/2<2||y+h/2>H-2) continue;
      const r={x1:x-w/2,y1:y-h/2,x2:x+w/2,y2:y+h/2};
      if(!clash(r)){ placed.push(r); put=[x,y,dx,dy]; break; }
    }
    if(!put){ hidden++; continue; }
    const [x,y,dx,dy]=put;
    if(dx||dy){                              // 비켜 놓았으면 짧은 안내선
      const A=toU(sx,sy), B=toU(x,y-(dy>0?h/2:dy<0?-h/2:0));
      g.appendChild(el("line",{x1:A[0],y1:A[1],x2:B[0],y2:B[1],class:"leader"}));
    }
    const U=toU(x,y+FS*0.35);
    const t=el("text",{x:U[0],y:U[1],class:"plabel","text-anchor":"middle"});
    t.style.fontSize=(FS/k).toFixed(2)+"px";
    t.style.strokeWidth=(3.4/k).toFixed(2)+"px";
    t.textContent=it.name;
    g.appendChild(t);
  }
  const hintEl=document.getElementById("peekHint");
  if(hintEl) hintEl.textContent = hidden ? `확대하면 이름 ${hidden}개가 더 나타납니다` : "";
}
function zoomAt(svg,clientX,clientY,factor){
  if(!svg||!G||!G.view) return;
  const W=G.W,H=G.H, v=G.view, vb=svg.viewBox.baseVal, r=svg.getBoundingClientRect();
  if(!r.width||!r.height) return;
  const px=vb.x+(clientX-r.left)/r.width*vb.width, py=vb.y+(clientY-r.top)/r.height*vb.height;
  const u=(px-vb.x)/vb.width, w=(py-vb.y)/vb.height;
  v.scale=v.scale*factor;
  const vw2=W/Math.max(ZMIN,Math.min(ZMAX,v.scale)), vh2=H/Math.max(ZMIN,Math.min(ZMAX,v.scale));
  const vx2=px-u*vw2, vy2=py-w*vh2;
  v.fx=(vx2+vw2/2)/W; v.fy=(vy2+vh2/2)/H;
  clampView(v); applyView(svg,W,H);
}
function zoomCenter(factor){
  if(!G||!G.view) return;
  const svg=stage.querySelector("svg"); if(!svg) return;
  const r=svg.getBoundingClientRect();
  zoomAt(svg, r.left+r.width/2, r.top+r.height/2, factor);
}
function panByClient(svg,dxClient,dyClient){
  if(!svg||!G||!G.view) return;
  const W=G.W,H=G.H, v=G.view, vb=svg.viewBox.baseVal, r=svg.getBoundingClientRect();
  if(!r.width||!r.height) return;
  v.fx-=dxClient/r.width*vb.width/W; v.fy-=dyClient/r.height*vb.height/H;
  clampView(v); applyView(svg,W,H);
}
document.getElementById("zIn").onclick=()=>zoomCenter(1.5);
document.getElementById("zOut").onclick=()=>zoomCenter(1/1.5);

(()=>{
  const pointers=new Map();
  let pinch=null, drag=null;
  // 확대/축소(휠·핀치)는 퀴즈 진행 중에도 쓸 수 있게 항상 켜둔다. 다만 한 손가락
  // 드래그로 지도를 미는 동작은 실전 퀴즈 중에는 끈다 — 국가를 탭하는 순간 살짝
  // 밀리면 오탭으로 이어질 수 있어서, 드래그 이동은 '지도 먼저 살펴보기'에서만 허용한다.
  stage.addEventListener("wheel",e=>{
    if(!G||!G.view) return;
    e.preventDefault();
    const svg=stage.querySelector("svg"); if(!svg) return;
    zoomAt(svg,e.clientX,e.clientY,e.deltaY<0?1.14:1/1.14);
  },{passive:false});
  stage.addEventListener("pointerdown",e=>{
    if(!G||!G.view) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){
      const pts=[...pointers.values()];
      pinch={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,
             mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2}};
      drag=null;
    }else if(pointers.size===1 && G.peek){
      drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,target:e.target};
    }
  });
  stage.addEventListener("pointermove",e=>{
    if(!G||!G.view||!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const svg=stage.querySelector("svg"); if(!svg) return;
    if(pointers.size===2 && pinch){
      const pts=[...pointers.values()];
      const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1;
      const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
      zoomAt(svg,pinch.mid.x,pinch.mid.y,dist/pinch.dist);
      panByClient(svg,mid.x-pinch.mid.x,mid.y-pinch.mid.y);
      pinch={dist,mid};
    }else if(pointers.size===1 && drag && G.peek){
      const dx=e.clientX-drag.lx, dy=e.clientY-drag.ly;
      if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6) drag.moved=true;
      if(drag.moved) panByClient(svg,dx,dy);
      drag.lx=e.clientX; drag.ly=e.clientY;
    }
  });
  function end(e){
    if(!G||!G.view) return;
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinch=null;
    if(pointers.size===0 && drag){
      if(!drag.moved && G.peek){
        const el=document.elementFromPoint(e.clientX,e.clientY);
        const nm=el&&el.dataset?el.dataset.n:"";
        if(nm) toast(nm,1200);
      }
      drag=null;
    }
  }
  stage.addEventListener("pointerup",end);
  stage.addEventListener("pointercancel",end);
})();

function beep(type){
  if(!soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const seq={ok:[[660,0],[990,.09]],no:[[180,0]],miss:[[300,0],[160,.12]]}[type];
    o.type = type==="ok" ? "triangle" : "sawtooth";
    seq.forEach(([f,d])=>o.frequency.setValueAtTime(f,t+d));
    g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(type==="ok"?.14:.10,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.start(t); o.stop(t+.34);
  }catch(e){}
}
/* — 레트로 BGM (8비트 칩튠, 외부 파일 없이 즉석 생성) — */
const BGM=(()=>{
  // 경쾌한 8비트풍 아르페지오 루프 (박자 단위, 0=쉼)
  const MELODY=[523,659,784,659, 587,698,880,698, 659,784,988,784, 523,659,784,988,
                784,659,523,392, 440,523,659,523, 392,494,587,494, 523,659,784,1046];
  const BASS  =[131,0,196,0, 147,0,220,0, 165,0,247,0, 131,0,196,0,
                196,0,131,0, 220,0,147,0, 165,0,131,0, 131,0,196,0];
  let ctx=null, timer=null, step=0, on=false;
  const STEP=0.155;
  function ensure(){ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function note(freq,t,dur,type,vol){
    if(!freq) return;
    const c=ensure(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur+.02);
  }
  function tickBGM(){
    if(!on) return;
    const c=ensure(), t=c.currentTime+.05;
    note(MELODY[step%MELODY.length], t, STEP*0.92, "square", .05);
    note(BASS[step%BASS.length],     t, STEP*0.92, "triangle", .06);
    step++;
    timer=setTimeout(tickBGM, STEP*1000);
  }
  return {
    start(){ if(on) return; on=true; ensure(); if(ctx.state==="suspended") ctx.resume(); step=0; tickBGM(); },
    stop(){ on=false; clearTimeout(timer); },
    toggle(){ on?this.stop():this.start(); return on; },
    get on(){ return on; }
  };
})();

function startGame(keys,peek){
  const box=unionBox([...selSubs]);
  G={keys, targets:new Set(keys), box, peek:!!peek, mode, speed, view:initView(),
     score:0, combo:0, best:0, lives:mode==="challenge"?5:Infinity,
     queue:shuffle(keys.slice()), labels:[], solved:0, ok:[], bad:{}, missed:new Set(), tries:{},
     spawn:0, last:0, paused:false, done:false, total:keys.length};
  show("play");
  labelsEl.innerHTML=""; mapCtl.style.display="flex"; peekBar.style.display="none"; peekBar.innerHTML="";
  playEl.classList.toggle("peekmode",!!peek);
  document.getElementById("hudName").firstChild.nodeValue=REGION[selRegion].ko;
  document.getElementById("hudSub").textContent=[...selSubs].map(s=>SUB[s].ko).join(" · ");
  renderStage(); hud(); updateSpeedBtn();
  if(peek){ enterPeek(); return; }
  stage.classList.add("live");
  hud(); G.last=performance.now(); raf=requestAnimationFrame(tick);
}
function renderStage(){
  const W=stage.clientWidth||900, H=stage.clientHeight||600;
  const old=stage.querySelector("svg"); if(old) old.remove();
  const svg=drawMap(W,H,G.box,{targets:G.targets,names:G.peek&&G.namesOn});
  svg.addEventListener("pointerdown",onMapClick);
  stage.insertBefore(svg,labelsEl);
  G.P=svg.__P; G.W=W; G.H=H;
  applyView(svg,W,H);
  // 해수면 선
  let sl=stage.querySelector(".sealine"); if(!sl){ sl=document.createElement("div"); sl.className="sealine"; stage.appendChild(sl); }
  sl.style.top=(H-46)+"px";
  sl.style.display=G.peek?"none":"";
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

  peekBar.querySelector("#pNames").onclick=e=>{ G.namesOn=!G.namesOn; renderStage();
    e.target.textContent=G.namesOn?"이름 숨기기":"이름 보기"; };

/* — 루프 — */
function tick(now){
  if(!G||G.done) return;
  const dt=Math.min(.05,(now-G.last)/1000); G.last=now;
  if(!G.paused){
    const cfg=SPEED[G.speed], dur=Math.max(4.2,cfg.dur*(1-.012*G.solved));
    G.spawn-=dt;
    if(G.queue.length && G.labels.length<cfg.max && G.spawn<=0){
      spawn(G.queue.shift(),dur); G.spawn=cfg.gap;
    }
    for(let i=G.labels.length-1;i>=0;i--){
      const L=G.labels[i];
      if(L.state==="fly"){ L.t+=dt; if(L.t>.34) kill(L,i); else place(L); continue; }
      L.y += dt/L.dur;
      if(L.y>=1){ miss(L,i); if(G.done) return; continue; }
      place(L);
    }
    if(!G.queue.length && !G.labels.length) return finish(true);
  }
  raf=requestAnimationFrame(tick);
}
function spawn(key,dur){
  const c=BY_KEY[key], d=document.createElement("div");
  d.className="chip";
  d.innerHTML=`<b>${c.ko}</b>${G.mode==="practice"?`<i>${SUB[c.sub].ko}</i>`:""}`;
  labelsEl.appendChild(d);
  let x=0,tries=0;
  do{ x=.12+Math.random()*.76; tries++; }while(tries<12 && G.labels.some(l=>Math.abs(l.x-x)<.16));
  const L={key,el:d,x,y:0,dur,state:"fall",t:0};
  G.labels.push(L); place(L);
}
function place(L){
  const H=G.H-70;
  let x=L.x*G.W, y=L.y*H;
  // 이름표가 화면 좌우 끝에서 잘리지 않도록 폭의 절반만큼 안쪽으로 붙잡아 둔다.
  const hw=(L.el.offsetWidth||0)/2;
  if(hw) x=Math.max(hw+8, Math.min(G.W-hw-8, x));
  if(L.state==="fly"){ const k=Math.min(1,L.t/.34); x+=(L.tx-x)*k; y+=(L.ty-y)*k; }
  L.el.style.transform=`translate(-50%,0) translate(${x}px,${y}px)`+(L.state==="fly"?` scale(${1-.35*Math.min(1,L.t/.34)})`:"");
}
function kill(L,i){ L.el.remove(); G.labels.splice(i,1); }
function floatText(x,y,txt,color){
  const f=document.createElement("div"); f.className="float"; f.textContent=txt; f.style.color=color;
  f.style.left=x+"px"; f.style.top=y+"px"; labelsEl.appendChild(f); setTimeout(()=>f.remove(),1000);
}
function flash(key,cls,ms){
  document.querySelectorAll(`[data-k="${key}"]`).forEach(n=>{
    n.classList.add(cls); setTimeout(()=>n.classList.remove(cls),ms||700);
  });
}
// 지도 확대·이동 중에는 SVG 안쪽 좌표(=지도 고유 좌표)와 화면에 실제로 보이는
// 픽셀 위치가 달라진다. 정답 애니메이션(날아가는 이름표, +점수 표시)이 확대된
// 지도 위에서도 정확한 위치에 떨어지도록, 현재 뷰박스를 기준으로 화면 픽셀로 바꿔준다.
function toScreen(ux,uy){
  const svg=stage.querySelector("svg");
  if(!svg||!G) return [ux,uy];
  const vb=svg.viewBox.baseVal;
  if(!vb||!vb.width||!vb.height) return [ux,uy];
  return [(ux-vb.x)/vb.width*G.W, (uy-vb.y)/vb.height*G.H];
}
function centerOf(key){
  const dot=stage.querySelector(`.dot[data-k="${key}"]`);
  const u = dot ? [+dot.getAttribute("cx"),+dot.getAttribute("cy")] : (()=>{ const c=BY_KEY[key]; return G.P(c.lon,c.lat); })();
  return toScreen(u[0],u[1]);
}

function onMapClick(e){
  if(!G||G.paused||G.done) return;
  if(G.peek) return; // 확대/이동과 탭 구분은 stage 포인터 핸들러가 처리
  const k=e.target.dataset?e.target.dataset.k:"";
  const nm=e.target.dataset?e.target.dataset.n:"";
  if(!k){ if(nm) toast(`${nm} · 출제 범위 밖입니다`); return; }
  const idx=G.labels.findIndex(l=>l.key===k && l.state==="fall");
  if(idx>=0){
    const L=G.labels[idx], c=BY_KEY[k];
    const gain=100+Math.round((1-L.y)*80)+Math.min(G.combo,10)*15;
    G.score+=gain; G.combo++; G.best=Math.max(G.best,G.combo); G.solved++;
    if(!G.tries[k]) G.ok.push(k);
    const q=centerOf(k); L.state="fly"; L.t=0; L.tx=q[0]; L.ty=q[1];
    L.el.classList.add("gone");
    flash(k,"hit-ok",600); floatText(q[0],q[1],"+"+gain,"var(--ok)"); beep("ok");
    if(G.combo>=5 && G.combo%5===0) toast(`연속 ${G.combo}`,900);
  }else if(G.targets.has(k)){
    G.tries[k]=(G.tries[k]||0)+1; G.bad[k]=(G.bad[k]||0)+1;
    G.combo=0; G.score=Math.max(0,G.score-20);
    flash(k,"hit-no",600); beep("no");
    toast(`${BY_KEY[k].ko} · 다시 찾아보세요`);
  }else{
    toast(`${nm} · 출제 범위 밖입니다`);
  }
  hud();
}
function miss(L,i){
  const k=L.key, c=BY_KEY[k];
  G.missed.add(k); G.tries[k]=(G.tries[k]||0)+1; G.combo=0;
  kill(L,i); beep("miss");
  flash(k,"reveal",1600);
  const q=centerOf(k); floatText(q[0],q[1],c.ko,"var(--reveal)");
  toast(`${c.ko} · 시간 초과`,1600);
  if(G.mode==="practice"){ G.queue.push(k); }
  else { G.lives--; if(G.lives<=0){ hud(); return finish(false); } }
  hud();
}
function hud(){
  document.getElementById("hudScore").textContent=G.score;
  document.getElementById("hudCombo").textContent=G.combo;
  document.getElementById("hudLeft").textContent=G.queue.length+G.labels.length;
  // 도전 모드의 남은 기회는 채워진 점 / 빈 점으로 보여준다(하트 이모지보다 차분하다).
  const L=Math.max(0,G.lives);
  document.getElementById("hudLives").textContent =
    G.mode==="challenge" ? "●".repeat(L)+"○".repeat(Math.max(0,5-L)) : "∞";
}
function finish(cleared){
  G.done=true; cancelAnimationFrame(raf); stage.classList.remove("live");
  G.labels.forEach(l=>l.el.remove()); G.labels=[];
  const total=G.total, firstTry=G.ok.length;
  const wrongKeys=[...new Set([...Object.keys(G.bad),...G.missed])];
  const acc=total?Math.round(firstTry/total*100):0;
  document.getElementById("resBody").innerHTML=`
    <div class="verdict">${cleared?"범위 완주":"기회 소진"}</div>
    <h2>${REGION[selRegion].ko}</h2>
    <p class="ressub">${[...selSubs].map(s=>SUB[s].ko).join(" · ")}</p>
    <div class="scoreboard">
      <div class="sb"><span>점수</span><b>${G.score}</b></div>
      <div class="sb"><span>한 번에 맞힘</span><b>${firstTry}<small style="font-size:15px;color:var(--dim)">/${total}</small></b></div>
      <div class="sb"><span>정확도</span><b>${acc}%</b></div>
      <div class="sb"><span>최고 연속</span><b>${G.best}</b></div>
    </div>
    ${wrongKeys.length?`<div class="lbl">다시 볼 나라 · ${wrongKeys.length}</div><div class="list">${
      wrongKeys.map(k=>`<span class="tag bad">${BY_KEY[k].ko}<small>${SUB[BY_KEY[k].sub].ko}</small></span>`).join("")}</div>`
      :`<div class="lbl">모두 한 번에 맞혔습니다</div>`}
    ${G.ok.length?`<div class="lbl" style="margin-top:24px">한 번에 맞힌 나라</div><div class="list">${
      G.ok.map(k=>`<span class="tag good">${BY_KEY[k].ko}</span>`).join("")}</div>`:""}
    <div class="actions">
      <button class="btn primary" id="again">같은 범위 다시 풀기</button>
      ${wrongKeys.length?`<button class="btn" id="onlyBad">틀린 나라만 (${wrongKeys.length})</button>`:""}
      <button class="btn" id="home2">권역 선택으로</button>
    </div>`;
  show("result");
  document.getElementById("again").onclick=()=>startGame(targetKeys());
  const ob=document.getElementById("onlyBad"); if(ob) ob.onclick=()=>startGame(shuffle(wrongKeys.slice()));
  document.getElementById("home2").onclick=goHome;
}

  stage.classList.remove("live"); playEl.classList.remove("peekmode"); peekBar.style.display="none"; show("home"); }
